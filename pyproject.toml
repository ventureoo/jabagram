[project]
name = "jabagram"
version = "1.1.0"
description = "Fully functional bridge between Telegram, XMPP and Matrix"
authors = [ {name = "Vasiliy Stelmachenok", email = "ventureo@yandex.ru"} ]
maintainers = [ {name = "Vasiliy Stelmachenok", email = "ventureo@yandex.ru"} ]
keywords = ["xmpp", "matrix", "telegram", "asyncio", "bridge"]
license = "GPL-3.0-only"
readme = "README.md"
requires-python = ">= 3.11"
dependencies = ["aiohttp", "slixmpp", "unidecode", "matrix-nio", "Pillow"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14"
]

[build-system]
requires = ["setuptools >= 61.0", "setuptools-gettext"]
build-backend = "setuptools.build_meta"

[project.scripts]
jabagram = "jabagram.runner:main"

[project.urls]
Homepage = "https://github.com/ventureoo/jabagram"
Repository = "https://github.com/ventureoo/jabagram.git"
"Bug Tracker" = "https://github.com/ventureoo/jabagram/issues"

[tool.setuptools]
packages = ["jabagram"]

[tool.setuptools-gettext]
source_dir = "locales"
